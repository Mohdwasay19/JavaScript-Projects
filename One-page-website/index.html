<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One Page Website</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <nav>
        <h2>My Website</h2>
        <ul>
            <li><a href="#home">Home</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#gallery">Gallery</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>
</header>

<section id="home" class="hero">
    <h1>Welcome to My One-Page Website</h1>
    <p>Built using HTML, CSS, and JavaScript.</p>
</section>

<section id="about">
    <h2>About</h2>
    <p>
        This website demonstrates a simple responsive one-page layout with
        a functional image lightbox gallery.
    </p>
</section>

<section id="gallery">
    <h2>Image Gallery</h2>

    <div class="gallery">
        <img src="image1.jpg" alt="Image 1">
        <img src="image2.jpg" alt="Image 2">
        <img src="image3.jpg" alt="Image 3">
        <img src="image4.jpg" alt="Image 4">
    </div>
</section>

<!-- Lightbox -->
<div id="lightbox" class="lightbox">
    <span class="close">&times;</span>
    <img class="lightbox-content" id="lightbox-img">
</div>

<section id="contact">
    <h2>Contact</h2>

    <form>
        <input type="text" placeholder="Your Name" required>

        <input type="email" placeholder="Your Email" required>

        <textarea placeholder="Your Message"></textarea>

        <button type="submit">Send</button>
    </form>
</section>

<footer>
    <p>&copy; 2026 My One-Page Website</p>
</footer>

<script src="script.js"></script>

</body>
</html>
